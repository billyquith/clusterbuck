[project]
name = "cbk-worker"
version = "0.12.0"
description = "clusterbuck worker agent — Python implementation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Nick Trout" }]

# Deliberately tiny, and deliberately all pure-Python so the whole worker can ship as one
# platform-independent zipapp (see README → Packaging). `cryptography` is the one exception
# and is NOT vendored: it is needed only to verify a self-update signature, and a key-holding
# verifier has to pre-exist the update channel by construction. Absent ⇒ self-update refuses,
# which is the same fail-closed posture as a missing pinned public key (ADR 13).
# The redis floor is a FLOOR ON BEHAVIOUR, not just on API. On redis-py 5.x the client
# defaults are `socket_timeout=None`, `socket_keepalive=False` and retries effectively off
# — under which a socket left dead by a suspend blocks forever on the next read and the
# worker becomes a zombie that never crashes, so no supervisor restarts it. `broker.py`
# now sets all of that explicitly, so the floor is not load-bearing for correctness; it is
# here because 8.x is the only major this is tested against and the only one the shipped
# zipapp vendors, and a floor should mean "known to work" rather than "might".
dependencies = [
    "redis>=8.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Required for `cbk work` to accept a signed self-update. Everything else works without it.
update = ["cryptography>=42"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "jsonschema>=4.20",
    "cryptography>=42",
    "ruff>=0.6",
]

[project.scripts]
cbk = "cbk_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cbk_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 96
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
# The docs and comments here use en dashes and arrows deliberately, matching the repo's voice.
ignore = ["RUF001", "RUF002", "RUF003"]
