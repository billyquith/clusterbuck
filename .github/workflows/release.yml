name: Release worker binaries

# Builds the `cbk` worker for every platform the fleet might run on (deployment.md → Worker
# build). Push a tag like `v0.7.0` to cut a release, or run it manually to get artifacts
# without publishing.
#
# Publish format is **self-contained single-file**, not Native AOT. That is deliberate and
# measured, not a shortcut — see ADR 27. Native AOT currently fails for two independent
# reasons (macOS link wants -lssl which Apple no longer ships linkably, and
# Spectre.Console.Cli emits IL2104/IL3053 trim/AOT warnings because its command binding is
# reflection-based). Self-contained still needs no .NET runtime on the node, which is the
# property that actually matters for a heterogeneous fleet; it just costs ~72-79 MB per
# artifact instead of AOT's ~15-25 MB.
#
# One runner builds every RID: .NET cross-publishes self-contained binaries fine (verified
# locally from macOS producing working PE32+, Mach-O and ELF aarch64 executables). Each
# artifact is then smoke-tested on its own native OS, because "it linked" and "it runs" are
# different claims.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # needed only by the release job, to attach artifacts

jobs:
  build:
    name: build ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     ext: ".exe" }   # Windows 11 x64
          - { rid: win-arm64,   ext: ".exe" }   # Windows on ARM
          - { rid: osx-arm64,   ext: "" }       # macOS Apple Silicon
          - { rid: osx-x64,     ext: "" }       # macOS Intel
          - { rid: linux-x64,   ext: "" }
          - { rid: linux-arm64, ext: "" }       # incl. Raspberry Pi 64-bit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        working-directory: worker
        run: |
          dotnet publish src/Clusterbuck.Worker -c Release -r ${{ matrix.rid }} \
            -p:PublishSingleFile=true -p:SelfContained=true -p:PublishAot=false \
            -o "out/${{ matrix.rid }}" --nologo

      - name: Record the digest the update channel pins
        working-directory: worker
        run: |
          BIN="out/${{ matrix.rid }}/cbk${{ matrix.ext }}"
          test -f "$BIN" || { echo "::error::no binary produced for ${{ matrix.rid }}"; exit 1; }
          sha256sum "$BIN" | tee "out/${{ matrix.rid }}/cbk.sha256"
          ls -lh "$BIN"

      - uses: actions/upload-artifact@v4
        with:
          name: cbk-${{ matrix.rid }}
          path: worker/out/${{ matrix.rid }}/
          if-no-files-found: error

  smoke:
    name: smoke ${{ matrix.rid }} on ${{ matrix.runs-on }}
    needs: build
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,   runs-on: windows-latest, bin: "cbk.exe" }
          - { rid: osx-arm64, runs-on: macos-latest,   bin: "cbk" }
          - { rid: linux-x64, runs-on: ubuntu-latest,  bin: "cbk" }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cbk-${{ matrix.rid }}
      - name: It runs, and reports the version the coordinator will judge it by
        shell: bash
        run: |
          chmod +x "${{ matrix.bin }}" || true
          # `--help` exercises the reflection-based CLI binding, which is exactly what AOT
          # would have broken — so this is the assertion that matters for this format.
          ./"${{ matrix.bin }}" --help

  release:
    name: attach to the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Package one archive per platform
        run: |
          cd dist
          for d in cbk-*; do
            rid="${d#cbk-}"
            if [ -f "$d/cbk.exe" ]; then (cd "$d" && zip -q "../${d}.zip" cbk.exe cbk.sha256);
            else tar -czf "${d}.tar.gz" -C "$d" cbk cbk.sha256; fi
          done
          ls -lh *.zip *.tar.gz 2>/dev/null || true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
          body: |
            Worker binaries for `${{ github.ref_name }}`. Self-contained — no .NET runtime
            needed on the node. Each archive carries a `cbk.sha256` digest.

            The signed release manifest that drives worker self-update is **not** generated
            here: the apply path (download, binary replacement, canary, rollback) is not
            implemented, so publishing a manifest would advertise an update channel that
            nothing consumes. Signature *verification* is built and tested (ADR 13).
