name: Release worker builds

# Builds the Python worker zipapp (deployment.md → Worker build). Push a tag like `v0.7.0`
# to cut a release, or run it manually to get artifacts without publishing.
#
# **Python — one `py3-none-any` zipapp, ~2.8 MB, no matrix.** Nothing in it is
# platform-specific, so there is nothing to build per platform.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # needed only by the release job, to attach artifacts

jobs:
  build-python:
    name: build py3-none-any
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        working-directory: worker
        run: uv venv && uv pip install -e ".[dev]"
      - name: Build the zipapp
        working-directory: worker
        # ONE artifact for every OS and architecture — no matrix, because there is nothing
        # platform-specific in it (ADR 29). A tag stamps its own version so the artifact
        # reports what the coordinator's version policy expects.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in
            [0-9]*) uv run python build.py --version "$VERSION" ;;
            *)      uv run python build.py ;;      # manual run: keep the source version
          esac
      - name: It must run under an interpreter that never installed it
        working-directory: worker
        run: |
          python3 dist/cbk.pyz --version
          python3 dist/cbk.pyz --help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: cbk-py3-none-any
          path: worker/dist/

  release:
    name: attach to the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cbk-py3-none-any/cbk.pyz
            dist/cbk-py3-none-any/cbk.pyz.sha256
          body: |
            Worker build for `${{ github.ref_name }}`.

            **`cbk.pyz` — Python, one file for every platform.** ~2.8 MB, `py3-none-any`.
            Needs Python 3.11+ on the node, plus `cryptography` in that interpreter if you
            want self-update (without it the worker runs normally and refuses updates).

            Each artifact carries its own sha256. The signed release manifest that drives
            self-update is **not** generated here — it is signed per-request by your
            coordinator from its own key, so the payload always matches what that coordinator
            considers current (ADR 13). The apply path is built and proven end-to-end
            (`deploy/e2e/selfupdate-py.sh`).
