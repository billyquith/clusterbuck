name: CI

# Gates every PR on the contract plus both conformance suites (implementation.md → CI/CD).
# CBK_TEST_REDIS_URL is set explicitly here, which makes Redis-backed tests FAIL rather than
# skip — locally the variable is unset and they skip for convenience, but CI must never
# report green for tests it silently didn't run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: server (Python)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        working-directory: server
        run: uv venv && uv pip install -e ".[dev]"
      - name: Test
        working-directory: server
        env:
          CBK_TEST_REDIS_URL: redis://localhost:6379/15
        run: uv run pytest -q

  worker:
    name: worker (C#/.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        working-directory: worker/dotnet
        run: dotnet build -c Release --nologo
      - name: Test
        working-directory: worker/dotnet
        # Some tests spawn the Python fake model server over real HTTP.
        run: dotnet test -c Release --nologo -v q

  worker-python:
    name: worker (Python)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        working-directory: worker/python
        run: uv venv && uv pip install -e ".[dev]"
      - name: Lint
        working-directory: worker/python
        run: uv run ruff check src tests build.py
      - name: Test
        working-directory: worker/python
        env:
          CBK_TEST_REDIS_URL: redis://localhost:6379/14
        run: uv run pytest -q
      - name: Build the shipped artifact
        working-directory: worker/python
        run: uv run python build.py
      - name: The artifact must run on a machine that never installed it
        working-directory: worker/python
        # A zipapp that imports fine in its own venv but not standalone is not shippable.
        # `python3` here is the system interpreter, not the project venv — deliberately.
        run: |
          test "$(python3 dist/cbk.pyz --version)" = "$(uv run cbk --version)"
          python3 dist/cbk.pyz --help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: cbk-pyz-ci
          path: worker/python/dist/

  contract:
    name: contract schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Every schema is valid, and every fixture matches its schema
        run: python contract/validate.py

  e2e:
    name: end-to-end (both workers)
    runs-on: ubuntu-latest
    needs: [server, worker, worker-python]
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install server
        working-directory: server
        run: uv venv && uv pip install -e ".[dev]"
      - name: Build the .NET worker
        working-directory: worker/dotnet
        run: dotnet build -c Debug --nologo
      - name: Install the Python worker
        working-directory: worker/python
        run: uv venv && uv pip install -e ".[dev]"
      - name: Run the e2e suite against BOTH workers
        # CBK_WORKER=both runs every shared proof twice, once per implementation, then each
        # flavour's own self-update proof. Anything that passes for one and fails for the
        # other is a contract violation by definition (ADR 7/22/29).
        #
        # The scripts reach Redis via `docker exec cbk-redis` for flushes; on a GitHub
        # service container that is not available, so point them at redis-cli directly.
        env:
          CBK_REDIS_CLI: "redis-cli -h localhost -p 6379"
          CBK_WORKER: both
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq redis-tools
          bash deploy/e2e/ci.sh
