name: CI

# Gates every PR on the contract plus both conformance suites (implementation.md → CI/CD).
# CBK_TEST_REDIS_URL is set explicitly here, which makes Redis-backed tests FAIL rather than
# skip — locally the variable is unset and they skip for convenience, but CI must never
# report green for tests it silently didn't run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: server (Python)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        working-directory: server
        run: uv venv && uv pip install -e ".[dev]"
      - name: Test
        working-directory: server
        env:
          CBK_TEST_REDIS_URL: redis://localhost:6379/15
        run: uv run pytest -q

  worker:
    name: worker (Python) — Redis-backed
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        working-directory: worker
        run: uv venv && uv pip install -e ".[dev]"
      - name: Lint
        working-directory: worker
        run: uv run ruff check src tests build.py
      - name: Test (full suite, including the Streams loop against real Redis)
        working-directory: worker
        env:
          CBK_TEST_REDIS_URL: redis://localhost:6379/14
        run: uv run pytest -q
      - name: Build the shipped artifact
        working-directory: worker
        run: uv run python build.py
      - name: The artifact must run on a machine that never installed it
        working-directory: worker
        # A zipapp that imports fine in its own venv but not standalone is not shippable.
        # `python3` here is the system interpreter, not the project venv — deliberately.
        run: |
          test "$(python3 dist/cbk.pyz --version)" = "$(uv run cbk --version)"
          python3 dist/cbk.pyz --help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: cbk-pyz-ci
          path: worker/dist/

  worker-crossplatform:
    # The artifact is py3-none-any, but the CODE has per-OS branches (probe.py's Windows
    # ctypes memory query, update.py's os.execv). This job runs the non-Redis suites on macOS
    # and Windows so those branches are at least imported and exercised — the Redis-backed
    # loop tests skip here (CBK_TEST_REDIS_URL unset), which is why they live in the job above
    # too. Caveat: test_update monkeypatches os.execv, so Windows's non-POSIX exec semantics
    # remain unproven — documented in ADR 29, not claimed here.
    name: worker (Python) — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        working-directory: worker
        run: uv venv && uv pip install -e ".[dev]"
      - name: Test (Redis-backed loop tests skip; probe/update/verify/CLI run)
        working-directory: worker
        run: uv run pytest -q
      - name: Build and run the artifact
        working-directory: worker
        # `python cbk.pyz` rather than executing it directly: Windows has no shebang
        # execution, so this is the portable way to prove the zip imports and runs on this OS.
        run: |
          uv run python build.py
          uv run python dist/cbk.pyz --version

  powershell:
    # 575 lines of PowerShell across three installers had NO automated coverage of any
    # kind — not a parse, not a lint. Every defect in them has been found by hand on a
    # real Windows node (see commits 51f1790, b1ed03a, and the coordinator's
    # ConvertFrom-StringData bug, which would have failed on every run). This will not
    # catch a logic error, but it catches the class that has cost the most: a script that
    # does not parse, or an obvious misuse, discovered at 2am on the node itself.
    name: install scripts (PowerShell + shell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every .ps1 parses
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $bad++
              Write-Host "::error file=$($_.FullName)::$($errors -join '; ')"
            } else {
              Write-Host "ok  $($_.Name)"
            }
          }
          if ($bad) { exit 1 }
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          # Errors fail the build; warnings are surfaced but tolerated, so this can land
          # without a cleanup pass on style rules nobody has agreed to yet.
          $found = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning
          $found | Format-Table -AutoSize
          $errs = @($found | Where-Object Severity -eq 'Error')
          if ($errs) { Write-Host "::error::$($errs.Count) PSScriptAnalyzer error(s)"; exit 1 }

  shellcheck:
    name: install scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every shell script parses, and shellcheck is clean of errors
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fail=0
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || { echo "::error file=$f::does not parse"; fail=1; }
          done
          # -S error only: the e2e scripts predate this and carry style warnings.
          shellcheck -S error $(git ls-files '*.sh') || fail=1
          exit $fail

  contract:
    name: contract schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Every schema is valid, and every fixture matches its schema
        run: python contract/validate.py

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    needs: [server, worker]
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install server
        working-directory: server
        run: uv venv && uv pip install -e ".[dev]"
      - name: Install worker
        working-directory: worker
        run: uv venv && uv pip install -e ".[dev]"
      - name: Run the e2e suite
        # The scripts reach Redis via `docker exec cbk-redis` for flushes; on a GitHub
        # service container that is not available, so point them at redis-cli directly.
        env:
          CBK_REDIS_CLI: "redis-cli -h localhost -p 6379"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq redis-tools
          bash deploy/e2e/ci.sh
