[project]
name = "clusterbuck-server"
version = "0.0.1"
description = "clusterbuck server (cbk-server): job API, sync front, coordinator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "pydantic>=2.7",
    "litellm>=1.93.0",
    "pyyaml>=6.0.3",
    "jinja2>=3.1.6",
    "cryptography>=49.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "jsonschema>=4.21",
]

[project.scripts]
cbk-server = "clusterbuck.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clusterbuck"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
