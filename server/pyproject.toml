[project]
name = "clusterbuck-server"
version = "0.0.1"
description = "clusterbuck server (cbk-server): job API, sync front, coordinator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "pydantic>=2.7",
    "litellm>=1.93.0",
    "pyyaml>=6.0.3",
    "jinja2>=3.1.6",
    "cryptography>=49.0.0",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "jsonschema>=4.21",
    # CI's lint step runs `uv run ruff`, which found nothing to spawn without this.
    "ruff>=0.6",
]

[project.scripts]
cbk-server = "clusterbuck.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clusterbuck"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
# Mirrors worker/pyproject.toml. The coordinator had no lint configuration and no CI lint
# step at all, while the worker had both and 575 lines of PowerShell had a dedicated job —
# so the largest body of Python in the repo was the only part nothing checked.
line-length = 96
src = ["clusterbuck"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
# The docs and comments here use en dashes and arrows deliberately, matching the repo's voice.
#
# UP042 wants `StrEnum` in place of `(str, Enum)`. Declined: these enums are serialised
# onto the wire and compared against JSON, and the two differ in how `str()` and f-strings
# render a member — `StrEnum` gives the value, `(str, Enum)` gives `Urgency.waitable`.
# Every call site here already passes `.value` explicitly, so switching would be a silent
# behaviour change in the formatting of anything that does not, in exchange for nothing.
ignore = ["RUF001", "RUF002", "RUF003", "UP042"]
