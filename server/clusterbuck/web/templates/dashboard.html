<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>clusterbuck</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="icon" href="/static/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/dashboard.css">
  <link rel="stylesheet" href="/static/uPlot.min.css">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/uPlot.iife.min.js"></script>
  <script src="/static/dashboard.js"></script>
</head>
<body>
  <header>
    <h1>clusterbuck</h1>
    <span class="tag">LAN LLM worker network · usage</span>
    <nav class="pages">
      <a href="/" class="active">Usage</a>
      <a href="/models">Models</a>
      <a href="/performance">Performance</a>
    </nav>
  </header>
  <main>
    <section class="status-strip" hx-get="/ui/status" hx-trigger="load, every 4s">…</section>
    <section class="panel chart-panel">
      <div class="panel-head">
        <h2>Activity over time</h2>
        <div class="seg" role="group" aria-label="chart view">
          <button type="button" data-view="venue">By venue</button>
          <button type="button" data-view="node">By worker</button>
        </div>
      </div>
      <div id="activity-chart"></div>
    </section>
    <section class="panel" style="margin-bottom:1rem"
             hx-get="/ui/connections" hx-trigger="load, every 3s">…</section>
    <section class="panel" hx-get="/ui/timeline" hx-trigger="load, every 3s">…</section>
  </main>
</body>
</html>
