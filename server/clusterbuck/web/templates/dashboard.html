<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>clusterbuck</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/static/htmx.min.js"></script>
  <style>
    :root {
      --bg: #0f1216; --panel: #171b21; --line: #262c35; --ink: #e6e9ee;
      --muted: #8a94a3; --accent: #4ade80; --warn: #fbbf24; --bad: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    header {
      display: flex; align-items: baseline; gap: .6rem;
      padding: 1rem 1.4rem; border-bottom: 1px solid var(--line);
    }
    header h1 { font-size: 1.1rem; margin: 0; letter-spacing: .02em; }
    header .tag { color: var(--muted); font-size: .8rem; }
    main { padding: 1.4rem; max-width: 1100px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1rem; }
    section.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.1rem; }
    section.panel h2 { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 .8rem; }
    .hero { text-align: center; padding: 1.6rem 1rem; margin-bottom: 1rem; }
    .hero .num { font-size: 2.6rem; font-weight: 650; color: var(--accent); }
    .hero .sub { color: var(--muted); font-size: .85rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
    th { color: var(--muted); font-weight: 500; font-size: .78rem; }
    td.n, th.n { text-align: right; }
    .pill { display: inline-block; padding: .05rem .5rem; border-radius: 999px; font-size: .72rem; border: 1px solid var(--line); color: var(--muted); }
    .pill.ok { color: var(--accent); border-color: #204d33; }
    .pill.warn { color: var(--warn); border-color: #4d3f16; }
    .empty { color: var(--muted); font-style: italic; }
    button {
      background: #1f2530; color: var(--ink); border: 1px solid var(--line);
      border-radius: 6px; padding: .25rem .6rem; font: inherit; font-size: .8rem;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    .kv { display: flex; justify-content: space-between; padding: .25rem 0; }
    .kv .k { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>clusterbuck</h1>
    <span class="tag">LAN LLM worker network · dashboard</span>
  </header>
  <main>
    <div id="headline" hx-get="/ui/headline" hx-trigger="load, every 4s">…</div>
    <section class="panel" style="margin-bottom:1rem"
             hx-get="/ui/proposals" hx-trigger="load, every 8s">…</section>
    <div class="grid">
      <section class="panel" hx-get="/ui/queues" hx-trigger="load, every 3s">…</section>
      <section class="panel" hx-get="/ui/nodes" hx-trigger="load, every 5s">…</section>
      <section class="panel" hx-get="/ui/fleet" hx-trigger="load, every 10s">…</section>
      <section class="panel" hx-get="/ui/ability" hx-trigger="load, every 15s">…</section>
      <section class="panel" hx-get="/ui/reservations" hx-trigger="load, every 5s">…</section>
    </div>
  </main>
</body>
</html>
