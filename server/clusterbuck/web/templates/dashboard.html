<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>clusterbuck</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="icon" href="/static/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/dashboard.css">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/dashboard.js"></script>
</head>
<body>
  <header>
    <h1>clusterbuck</h1>
    <span class="tag">LAN LLM worker network · usage</span>
    <nav class="pages">
      <a href="/" class="active">Usage</a>
      <a href="/models">Models</a>
      <a href="/performance">Performance</a>
    </nav>
  </header>
  <main>
    <div class="grid">
      <section class="panel" hx-get="/ui/connections" hx-trigger="load, every 2s">…</section>
      <section class="panel" hx-get="/ui/timeline" hx-trigger="load, every 2s">…</section>
    </div>
    <div class="grid">
      <section class="panel" hx-get="/ui/queues" hx-trigger="load, every 3s">…</section>
      <section class="panel" hx-get="/ui/reservations" hx-trigger="load, every 5s">…</section>
    </div>
    <div id="headline" hx-get="/ui/headline" hx-trigger="load, every 4s">…</div>
  </main>
</body>
</html>
