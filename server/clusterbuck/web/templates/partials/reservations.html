<h2>Reservations</h2>
{% if rows %}
<table>
  <tr><th>id</th><th>status</th><th>state</th><th>node</th></tr>
  {% for r in rows %}
  <tr>
    <td>{{ r["id"][:14] }}…</td>
    <td>
      {% if r["status"] == "confirmed" %}<span class="pill ok">confirmed</span>
      {% else %}<span class="pill warn">declined</span>{% endif %}
    </td>
    <td>{{ r["state"] or "—" }}</td>
    <td>{{ r["node"] or "—" }}</td>
  </tr>
  {% endfor %}
</table>
{% else %}
<p class="empty">no reservations</p>
{% endif %}
