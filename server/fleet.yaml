# fleet.yaml — the static model/capability registry seed (protocols.md §5).
#
# This is the MVP seed. In the fleet-management phase (M4) the same shape becomes the
# seed for a coordinator-held dynamic registry maintained by enrollment + heartbeats.
#
# Two access paths to each node hang off a capability:
#   - `queue`        — the async plane: workers consume q:<...> (env-configured).
#   - `model_server` — the sync plane: LiteLLM calls this OpenAI-compatible endpoint directly
#                      (the worker is NOT in the sync path).
#
# Example fleet only — generic ids, placeholder MACs, localhost endpoints. Edit for a real
# deployment. On a single dev node every model_server is localhost; per-node LAN addresses
# arrive with the multi-node registry.

nodes:
  - id: node-a
    mac: "aa:bb:cc:dd:ee:ff"        # for Wake-on-LAN (M2)
    wake: on-demand                 # opportunistic | scheduled | on-demand
    capabilities: [8b-extract]
  - id: node-b
    mac: "11:22:33:44:55:66"
    wake: opportunistic
    capabilities: [8b-extract, 32b-reason, 70b-reason]

# price_*_per_1k are the CLOUD-EQUIVALENT rates a local run avoids paying (USD per 1k
# tokens), used for the avoided-cloud-spend headline. Example values only — set them to the
# rates of the cloud model you'd otherwise fall back to for each tier.
capabilities:
  8b-extract:
    queue: "q:8b-extract"
    model_server: "http://localhost:11434/v1"
    model: "llama3.2:3b"
    price_in_per_1k: 0.0002
    price_out_per_1k: 0.0006
  32b-reason:
    queue: "q:32b-reason"
    model_server: "http://localhost:11434/v1"
    model: "qwen2.5:32b"
    price_in_per_1k: 0.0009
    price_out_per_1k: 0.0027
  70b-reason:
    queue: "q:70b-reason"
    model_server: "http://localhost:11434/v1"
    model: "llama3.1:70b"
    price_in_per_1k: 0.0027
    price_out_per_1k: 0.0035

  # Registered provider accounts (ADR 30; model-evaluation.md → Provider accounts, budget,
  # and the cost-quality loop). No `model_server` — these have no host node, so the
  # coordinator calls the provider directly in-process and never gives a worker the key.
  # `model` is a LiteLLM "<provider>/<model>" id; `api_key_env` names the environment
  # variable holding that provider's key (never the key itself — set it in the
  # coordinator's own environment, not here). An unset env var excludes the artifact from
  # routing with a warning; it does not stop the server from starting. Like any capability,
  # these enter the ability matrix unscored and are measured by the eval harness before
  # they are ever selected — nothing here is assumed quality, only priced.
  claude-sonnet:
    queue: "q:claude-sonnet"
    model: "anthropic/claude-3-5-sonnet-20241022"
    api_key_env: CBK_ANTHROPIC_API_KEY
    cloud: true
    price_in_per_1k: 0.003
    price_out_per_1k: 0.015
  gpt-4o-mini:
    queue: "q:gpt-4o-mini"
    model: "openai/gpt-4o-mini"
    api_key_env: CBK_OPENAI_API_KEY
    cloud: true
    price_in_per_1k: 0.00015
    price_out_per_1k: 0.0006
