# fleet.yaml — the static model/capability registry seed (protocols.md §5).
#
# This is the MVP seed. In the fleet-management phase (M4) the same shape becomes the
# seed for a coordinator-held dynamic registry maintained by enrollment + heartbeats.
#
# Two access paths to each node hang off a capability:
#   - the async plane — the stream is DERIVED from the capability name (`q:<capability>`,
#     protocols.md §5). It is not configured here: a worker builds its stream names from
#     its own capability list and never reads this file, so a name declared here could
#     only ever disagree with the one in use. Declaring `queue:` is still accepted for
#     older files, but it must match, or the fleet refuses to load.
#   - `model_server` — the sync plane: LiteLLM calls this OpenAI-compatible endpoint directly
#                      (the worker is NOT in the sync path).
#
# Example fleet only — generic ids, placeholder MACs, localhost endpoints. Edit for a real
# deployment. On a single dev node every model_server is localhost; per-node LAN addresses
# arrive with the multi-node registry.

nodes:
  - id: node-a
    mac: "aa:bb:cc:dd:ee:ff"        # for Wake-on-LAN (M2)
    wake: on-demand                 # opportunistic | scheduled | on-demand
    capabilities: [8b-extract]
  - id: node-b
    mac: "11:22:33:44:55:66"
    wake: opportunistic
    capabilities: [8b-extract, 32b-reason, 70b-reason]

# price_*_per_1k are the CLOUD-EQUIVALENT rates a local run avoids paying (USD per 1k
# tokens), used for the avoided-cloud-spend headline. Example values only — set them to the
# rates of the cloud model you'd otherwise fall back to for each tier.
#
# `description` is what the dashboard shows beside the tier name — say what a client would
# send here, in words. The name is a routing key and stays terse; this is for people.
capabilities:
  8b-extract:
    description: "Quick, cheap structured work: pull fields into JSON, tag, classify"
    model_server: "http://localhost:11434/v1"
    model: "llama3.2:3b"
    price_in_per_1k: 0.0002
    price_out_per_1k: 0.0006
  32b-reason:
    description: "Step-by-step problems, summaries and reading code, where a small model slips"
    model_server: "http://localhost:11434/v1"
    model: "qwen2.5:32b"
    price_in_per_1k: 0.0009
    price_out_per_1k: 0.0027
    # Where a `cloud_ok` job addressed to this tier BY NAME may go when no machine can
    # serve it (design.md §8), and this tier's sync-plane fallback. A job's own
    # `privacy: local_only` still keeps it here; this grants nothing on its own.
    cloud_fallback: claude-sonnet
  70b-reason:
    description: "The strongest local model; slow — for work that must not go to the cloud"
    model_server: "http://localhost:11434/v1"
    model: "llama3.1:70b"
    price_in_per_1k: 0.0027
    price_out_per_1k: 0.0035

  # Registered provider accounts (ADR 30; model-evaluation.md → Provider accounts, budget,
  # and the cost-quality loop). No `model_server` — these have no host node, so the
  # coordinator calls the provider directly in-process and never gives a worker the key.
  # `model` is a LiteLLM "<provider>/<model>" id; `api_key_env` names the environment
  # variable holding that provider's key (never the key itself — set it in the
  # coordinator's own environment, not here). An unset env var excludes the artifact from
  # routing with a warning; it does not stop the server from starting. Like any capability,
  # these enter the ability matrix unscored and are measured by the eval harness before
  # they are ever selected — nothing here is assumed quality, only priced.
  #
  # The capability fields are what the model CAN DO, as opposed to how well (ADR 37):
  # context window, tool calling, schema-constrained output, vision. For a LOCAL artifact
  # these live in the model catalog; a provider account has no host and never enters that
  # catalog, so it declares them here. An artifact that declares nothing is excluded from
  # any job that requires a feature, rather than served on the assumption it copes.
  #
  # Prices are optional here. A provider account's spend is priced by LiteLLM's own price
  # map for the model that actually answered, cache reads and writes included; a
  # price_*_per_1k set here is only used for a model that map does not know (the usage
  # row then says `cost_source: fleet`). The startup log names any cloud tier neither can
  # price, because its spend would otherwise count as $0 against the budget.
  #
  # The feature fields below are LiteLLM's model info for each id, not guesses.
  claude-sonnet:
    model: "anthropic/claude-sonnet-5"
    api_key_env: CBK_ANTHROPIC_API_KEY
    cloud: true
    context_tokens: 1000000
    supports_tools: true
    supports_json_schema: true
    supports_vision: true
  gpt-5.6-sol:
    model: "openai/gpt-5.6-sol"
    api_key_env: CBK_OPENAI_API_KEY
    cloud: true
    context_tokens: 922000
    supports_tools: true
    supports_json_schema: true
    supports_vision: true
  gpt-5.6-terra:
    model: "openai/gpt-5.6-terra"
    api_key_env: CBK_OPENAI_API_KEY
    cloud: true
    context_tokens: 922000
    supports_tools: true
    supports_json_schema: true
    supports_vision: true
  gpt-5.6-luna:
    model: "openai/gpt-5.6-luna"
    api_key_env: CBK_OPENAI_API_KEY
    cloud: true
    context_tokens: 922000
    supports_tools: true
    supports_json_schema: true
    supports_vision: true
